name: Build macOS App

on:
  push:
    tags:
      - 'v*'  # 只在推送版本标签时触发

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        arch: [x86_64, arm64]
      fail-fast: false  # 允许一个架构失败时继续构建另一个
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install Dependencies
      run: |
        brew update
        brew install cmake ninja p7zip pkg-config
        brew install qt@6
        
    - name: Set up Qt
      id: qt
      run: |
        qtpath=$(brew --prefix qt@6)
        echo "Qt installation path: $qtpath"
        echo "QT_PATH=${qtpath}" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=${qtpath}" >> $GITHUB_ENV
        echo "PATH=${qtpath}/bin:$PATH" >> $GITHUB_ENV
        
        # 验证 Qt 安装
        echo "Checking Qt installation..."
        ls -la $qtpath/lib/cmake/Qt6
        ls -la $qtpath/lib/cmake/Qt6Core
        ls -la $qtpath/lib/cmake/Qt6Widgets
        
    - name: Verify Qt Installation
      run: |
        echo "Qt path: $QT_PATH"
        echo "CMake prefix path: $CMAKE_PREFIX_PATH"
        echo "Checking Qt version:"
        qmake6 --version
        echo "Checking Qt libraries:"
        ls -la $QT_PATH/lib
        
    - name: Create Build Directory
      run: mkdir build
      
    - name: Configure CMake
      run: |
        cd build
        echo "Running CMake configuration..."
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH \
          -DQt6_DIR=$QT_PATH/lib/cmake/Qt6 \
          -DQt6Core_DIR=$QT_PATH/lib/cmake/Qt6Core \
          -DQt6Gui_DIR=$QT_PATH/lib/cmake/Qt6Gui \
          -DQt6Widgets_DIR=$QT_PATH/lib/cmake/Qt6Widgets \
          -DQt6WebEngine_DIR=$QT_PATH/lib/cmake/Qt6WebEngine \
          -DQt6WebEngineCore_DIR=$QT_PATH/lib/cmake/Qt6WebEngineCore \
          -DQt6WebEngineWidgets_DIR=$QT_PATH/lib/cmake/Qt6WebEngineWidgets \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
          -DCMAKE_INSTALL_RPATH="@executable_path/../Frameworks" \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          .. 2>&1 | tee cmake_output.log
        
        echo "CMake configuration complete. Checking output..."
        if [ -f "CMakeFiles/CMakeError.log" ]; then
          echo "CMake errors found:"
          cat CMakeFiles/CMakeError.log
        fi
        
    - name: Build
      run: |
        cd build
        echo "Starting build process..."
        ninja -v 2>&1 | tee build_output.log
        
        if [ $? -ne 0 ]; then
          echo "Build failed. Checking error log..."
          if [ -f "build_output.log" ]; then
            echo "Last 50 lines of build output:"
            tail -n 50 build_output.log
          fi
          exit 1
        fi
        
    - name: Deploy Qt Dependencies
      run: |
        cd build
        # 创建 Frameworks 目录
        mkdir -p AuxiliaryArticalUploadTool.app/Contents/Frameworks
        # 复制 Qt 框架
        for lib in $(otool -L AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool | grep $QT_PATH | cut -d' ' -f1); do
          cp -R $(dirname $lib) AuxiliaryArticalUploadTool.app/Contents/Frameworks/
        done
        # 修复库路径
        install_name_tool -add_rpath "@executable_path/../Frameworks" AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool
        
    - name: List Build Directory
      run: |
        cd build
        ls -la
        
    - name: Create DMG
      run: |
        cd build
        if [ ! -d "AuxiliaryArticalUploadTool.app" ]; then
          echo "Error: AuxiliaryArticalUploadTool.app not found"
          ls -la
          exit 1
        fi
        # 创建临时目录用于打包
        mkdir -p dmg_contents
        cp -r AuxiliaryArticalUploadTool.app dmg_contents/
        
        # 创建说明文件
        cat > dmg_contents/README.txt << EOL
        安装说明：
        1. 将应用拖拽到 Applications 文件夹
        2. 打开终端(Terminal.app)
        3. 运行以下命令移除应用隔离属性：
           sudo xattr -rd com.apple.quarantine /Applications/AuxiliaryArticalUploadTool.app
        4. 如果仍然无法打开，请运行以下命令检查权限：
           ls -la /Applications/AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool
           chmod +x /Applications/AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool
        5. 在系统偏好设置 -> 安全性与隐私 中允许打开应用
        EOL
        
        # 创建 DMG 文件
        hdiutil create -volname "AuxiliaryArticalUploadTool-${{ matrix.arch }}" -srcfolder dmg_contents -ov -format UDZO "AuxiliaryArticalUploadTool-${{ matrix.arch }}.dmg"
        
    - name: Get Tag Name
      id: get_tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/AuxiliaryArticalUploadTool-${{ matrix.arch }}.dmg
        name: Release ${{ env.TAG_NAME }}
        body: |
          ### 安装说明
          1. 将应用拖拽到 Applications 文件夹
          2. 打开终端(Terminal.app)
          3. 运行以下命令移除应用隔离属性：
             ```bash
             sudo xattr -rd com.apple.quarantine /Applications/AuxiliaryArticalUploadTool.app
             ```
          4. 如果仍然无法打开，请运行以下命令检查权限：
             ```bash
             ls -la /Applications/AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool
             chmod +x /Applications/AuxiliaryArticalUploadTool.app/Contents/MacOS/AuxiliaryArticalUploadTool
             ```
          5. 在系统偏好设置 -> 安全性与隐私 中允许打开应用

          ### 版本说明
          - Intel (x86_64) 版本：AuxiliaryArticalUploadTool-x86_64.dmg
          - Apple Silicon (arm64) 版本：AuxiliaryArticalUploadTool-arm64.dmg
          
          请根据你的 Mac 芯片类型选择对应的版本：
          - Intel Mac：下载 x86_64 版本
          - M1/M2/M3 Mac：下载 arm64 版本
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 