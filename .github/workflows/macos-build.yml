name: Build macOS App

on:
  push:
    tags:
      - 'v*'  # 当推送版本标签时触发

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install Dependencies
      run: |
        brew update
        brew install cmake ninja p7zip
        brew install pkg-config
        
    - name: Set up Qt
      id: qt
      run: |
        brew install qt@6
        echo "Qt installation path:"
        brew --prefix qt@6
        qtpath=$(brew --prefix qt@6)
        echo "QT_PATH=${qtpath}" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=${qtpath}" >> $GITHUB_ENV
        echo "PATH=${qtpath}/bin:$PATH" >> $GITHUB_ENV
        
    - name: Verify Qt Installation
      run: |
        echo "Qt path: $QT_PATH"
        echo "CMake prefix path: $CMAKE_PREFIX_PATH"
        qmake6 --version
        
    - name: Create Build Directory
      run: mkdir build
      
    - name: Configure CMake
      run: |
        cd build
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH \
          -DQt6_DIR=$QT_PATH/lib/cmake/Qt6 \
          -DQt6Core_DIR=$QT_PATH/lib/cmake/Qt6Core \
          -DQt6Gui_DIR=$QT_PATH/lib/cmake/Qt6Gui \
          -DQt6Widgets_DIR=$QT_PATH/lib/cmake/Qt6Widgets \
          -DQt6WebEngine_DIR=$QT_PATH/lib/cmake/Qt6WebEngine \
          -DQt6WebEngineCore_DIR=$QT_PATH/lib/cmake/Qt6WebEngineCore \
          -DQt6WebEngineWidgets_DIR=$QT_PATH/lib/cmake/Qt6WebEngineWidgets \
          ..
        
    - name: Build
      run: |
        cd build
        ninja -v
        
    - name: List Build Directory
      run: |
        cd build
        ls -la
        
    - name: Create DMG
      run: |
        cd build
        if [ ! -d "AuxiliaryArticalUploadTool.app" ]; then
          echo "Error: AuxiliaryArticalUploadTool.app not found"
          ls -la
          exit 1
        fi
        # 创建临时目录用于打包
        mkdir -p dmg_contents
        cp -r AuxiliaryArticalUploadTool.app dmg_contents/
        # 创建 DMG 文件
        hdiutil create -volname "AuxiliaryArticalUploadTool" -srcfolder dmg_contents -ov -format UDZO AuxiliaryArticalUploadTool.dmg
        
    - name: Get Tag Name
      id: get_tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/AuxiliaryArticalUploadTool.dmg
        name: Release ${{ env.TAG_NAME }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 